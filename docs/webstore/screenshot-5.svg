<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg"
     style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;">
  <title>Idle — dark mode panel (Diffuse activity)</title>

  <defs>
    <filter id="panel-shadow-dark">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- ── Browser chrome (light — host chrome stays default) ── -->
  <rect width="1280" height="52" fill="#F1F3F4"/>
  <rect x="8" y="8" width="208" height="36" rx="6" fill="#FFFFFF"/>
  <rect x="19" y="16" width="16" height="16" rx="3.5" fill="#263430"/>
  <rect x="23.6" y="20.6" width="2.6" height="6.75" rx="1" fill="#7ECDC8"/>
  <rect x="27.9" y="20.6" width="2.6" height="6.75" rx="1" fill="#7ECDC8"/>
  <text x="43" y="30" font-size="12" fill="#1A1A1A">Claude · New chat</text>
  <text x="236" y="32" font-size="20" fill="#AAAAAA">&#8249;</text>
  <text x="256" y="32" font-size="20" fill="#CCCCCC">&#8250;</text>
  <rect x="344" y="13" width="592" height="26" rx="13" fill="#FFFFFF"/>
  <text x="640" y="30" text-anchor="middle" font-size="13" fill="#5A5A5A">claude.ai</text>
  <rect x="1211" y="15" width="22" height="22" rx="4.8" fill="#263430"/>
  <rect x="1217.3" y="21.3" width="3.6" height="9.3" rx="1" fill="#7ECDC8"/>
  <rect x="1223.1" y="21.3" width="3.6" height="9.3" rx="1" fill="#7ECDC8"/>
  <circle cx="1256" cy="22" r="1.8" fill="#777777"/>
  <circle cx="1256" cy="29" r="1.8" fill="#777777"/>
  <circle cx="1256" cy="36" r="1.8" fill="#777777"/>

  <!-- ── Dark sidebar ── -->
  <rect x="0" y="52" width="240" height="748" fill="#0D0D0D"/>
  <rect x="12" y="68" width="216" height="36" rx="6" fill="#1E1E1E" stroke="#2A2A2A" stroke-width="1"/>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#BBBBBB">+ New chat</text>
  <rect x="0" y="120" width="240" height="40" fill="#1E1E1E"/>
  <text x="16" y="138" font-size="12" fill="#CCCCCC" font-weight="500">Optimize slow queries</text>
  <text x="16" y="153" font-size="10" fill="#444444">Just now</text>
  <text x="16" y="184" font-size="12" fill="#404040">Architecture review</text>
  <text x="16" y="216" font-size="12" fill="#404040">Fix the API parser</text>
  <text x="16" y="248" font-size="12" fill="#404040">Refactor auth</text>
  <circle cx="28" cy="780" r="14" fill="#3D8B7A"/>
  <text x="28" y="784" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">A</text>

  <!-- ── Dark main chat area ── -->
  <rect x="240" y="52" width="1040" height="748" fill="#111111"/>

  <!-- User message (dark theme) -->
  <rect x="454" y="76" width="470" height="60" rx="12" fill="#2A2A2A"/>
  <text x="474" y="100" font-size="14" fill="#E8E8E8">What&#39;s the best approach for optimizing</text>
  <text x="474" y="118" font-size="14" fill="#E8E8E8">slow database queries in production?</text>

  <!-- AI response (dark theme) -->
  <text x="356" y="168" font-size="14" fill="#E0E0E0">Start with measurement, not guesswork. Here&#39;s a systematic</text>
  <text x="356" y="188" font-size="14" fill="#E0E0E0">approach that&#39;s worked reliably across different database types:</text>

  <text x="356" y="218" font-size="14" font-weight="600" fill="#E8E8E8">1. Enable slow query logging</text>
  <text x="356" y="240" font-size="14" fill="#C8C8C8">Set a threshold (100ms is a good starting point) and collect</text>
  <text x="356" y="260" font-size="14" fill="#C8C8C8">real query patterns for a week. You&#39;ll often find 3–5 queries</text>
  <text x="356" y="280" font-size="14" fill="#C8C8C8">accounting for the majority of load.</text>

  <text x="356" y="310" font-size="14" font-weight="600" fill="#E8E8E8">2. Use EXPLAIN ANALYZE</text>
  <text x="356" y="332" font-size="14" fill="#C8C8C8">Look for sequential scans on large tables — that&#39;s usually</text>
  <text x="356" y="352" font-size="14" fill="#C8C8C8">the first sign of a missing index. Also watch for nested loop</text>
  <text x="356" y="372" font-size="14" fill="#C8C8C8">joins on unbounded result sets.</text>

  <text x="356" y="402" font-size="14" font-weight="600" fill="#E8E8E8">3. Add indexes strategically</text>
  <text x="356" y="424" font-size="14" fill="#C8C8C8">Index columns that appear in WHERE, JOIN, and ORDER BY clauses</text>
  <text x="356" y="444" font-size="14" fill="#C8C8C8">for your slowest queries. Composite indexes can dramatically</text>
  <text x="356" y="464" font-size="14" fill="#C8C8C8">reduce row scans when column order</text>

  <!-- Streaming dots (dark) -->
  <circle cx="620" cy="459" r="3.5" fill="#555555"/>
  <circle cx="632" cy="459" r="3.5" fill="#555555" opacity="0.6"/>
  <circle cx="644" cy="459" r="3.5" fill="#555555" opacity="0.3"/>

  <!-- Input area (dark) -->
  <rect x="340" y="722" width="600" height="52" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1"/>
  <text x="368" y="752" font-size="14" fill="#444444">Reply to Claude…</text>
  <circle cx="912" cy="748" r="18" fill="#3D8B7A"/>
  <text x="912" y="756" text-anchor="middle" font-size="18" fill="#FFFFFF">&#8593;</text>

  <!-- ── Idle panel — dark mode (Diffuse activity) ── -->
  <rect x="943" y="578" width="320" height="192" rx="9" fill="#000000" opacity="0.4"/>
  <rect x="942" y="576" width="320" height="192" rx="9" fill="#000000" opacity="0.3"/>
  <rect x="940" y="572" width="320" height="192" rx="8"
        fill="#1E1E1E" stroke="#FFFFFF1A" stroke-width="1"
        filter="url(#panel-shadow-dark)"/>

  <!-- Drag handle (dark) -->
  <circle cx="1086" cy="586" r="2" fill="#444444"/>
  <circle cx="1094" cy="586" r="2" fill="#444444"/>
  <circle cx="1102" cy="586" r="2" fill="#444444"/>

  <!-- Card content -->
  <!-- Meta row (dark) -->
  <text x="956" y="614" font-size="10.5" fill="#7A7A7A" letter-spacing="0.4">DIFFUSE</text>
  <text x="1244" y="614" font-size="10.5" fill="#7A7A7A" text-anchor="end">1 MIN</text>

  <!-- Title (dark) -->
  <text x="956" y="633" font-size="13" font-weight="500" fill="#C0C0C0">Close your eyes</text>

  <!-- Body (dark) -->
  <text x="956" y="655" font-size="14" fill="#E8E8E8">Sixty seconds. Not meditation.</text>
  <text x="956" y="677" font-size="14" fill="#E8E8E8">Just stop looking at things.</text>

  <!-- Panel divider (dark) -->
  <line x1="940" y1="695" x2="1260" y2="695" stroke="#FFFFFF1A" stroke-width="1"/>

  <!-- Actions (dark) -->
  <text x="956" y="726" font-size="12" fill="#7A7A7A">Skip</text>
  <text x="1244" y="726" font-size="12" fill="#7A7A7A" text-anchor="end">Mute</text>

</svg>
