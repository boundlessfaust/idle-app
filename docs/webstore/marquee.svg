<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg"
     style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;">
  <title>Idle — marquee 1400×560</title>

  <!-- Background -->
  <rect width="1400" height="560" fill="#F2EFE9"/>

  <!-- ── Left: brand identity (x=0..560) ── -->

  <!-- Idle icon 80×80, centered at (200, 160) -->
  <rect x="160" y="120" width="80" height="80" rx="17.6" fill="#263430"/>
  <!-- Bar 1: 0.289*80=23.1, 0.164*80=13.1, 0.422*80=33.8 -->
  <rect x="183.1" y="143.1" width="13.1" height="33.8" rx="4" fill="#7ECDC8"/>
  <!-- Bar 2: 0.555*80=44.4 -->
  <rect x="204.4" y="143.1" width="13.1" height="33.8" rx="4" fill="#7ECDC8"/>

  <!-- "idle" wordmark -->
  <text x="200" y="308" text-anchor="middle"
        font-size="100" font-weight="300" letter-spacing="-1"
        fill="#1A1A1A">idle</text>

  <!-- Tagline -->
  <text x="200" y="350" text-anchor="middle"
        font-size="20" fill="#666666">A brain-health companion</text>
  <text x="200" y="376" text-anchor="middle"
        font-size="20" fill="#666666">for AI wait times</text>

  <!-- Supported sites -->
  <text x="200" y="432" text-anchor="middle"
        font-size="13.5" fill="#AAAAAA" letter-spacing="0.3">claude.ai  ·  chatgpt.com  ·  gemini.google.com  ·  perplexity.ai</text>

  <!-- Feature pills -->
  <rect x="52" y="456" width="112" height="28" rx="14" fill="#F0EDE7" stroke="#D8D5CF" stroke-width="1"/>
  <text x="108" y="474" text-anchor="middle" font-size="11" fill="#555555">No telemetry</text>

  <rect x="176" y="456" width="124" height="28" rx="14" fill="#F0EDE7" stroke="#D8D5CF" stroke-width="1"/>
  <text x="238" y="474" text-anchor="middle" font-size="11" fill="#555555">All data local</text>

  <rect x="312" y="456" width="88" height="28" rx="14" fill="#F0EDE7" stroke="#D8D5CF" stroke-width="1"/>
  <text x="356" y="474" text-anchor="middle" font-size="11" fill="#555555">Free forever</text>

  <!-- Vertical divider -->
  <line x1="460" y1="40" x2="460" y2="520" stroke="#E0DDD8" stroke-width="1"/>

  <!-- ── Right: panel showcase (x=460..1400) ── -->

  <defs>
    <filter id="marquee-shadow" x="-8%" y="-5%" width="122%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="card2-shadow" x="-8%" y="-5%" width="122%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Simulated browser window backdrop -->
  <rect x="490" y="30" width="880" height="500" rx="10"
        fill="#ECEBE8" stroke="#D4D2CE" stroke-width="1"/>
  <!-- Browser chrome bar -->
  <rect x="490" y="30" width="880" height="40" rx="10" fill="#E8E6E2"/>
  <rect x="490" y="58" width="880" height="12" fill="#E8E6E2"/>
  <!-- Traffic lights -->
  <circle cx="516" cy="50" r="6" fill="#FF5F57"/>
  <circle cx="534" cy="50" r="6" fill="#FEBC2E"/>
  <circle cx="552" cy="50" r="6" fill="#28C840"/>
  <!-- URL bar -->
  <rect x="612" y="38" width="460" height="24" rx="12" fill="#FAFAF8"/>
  <text x="842" y="54" text-anchor="middle" font-size="12" fill="#777777">claude.ai</text>

  <!-- Page content area (simplified) -->
  <rect x="490" y="70" width="880" height="460" fill="#FAFAF8"/>

  <!-- Simulated chat sidebar -->
  <rect x="490" y="70" width="180" height="460" fill="#1C1C1C"/>
  <text x="580" y="110" text-anchor="middle" font-size="11" fill="#888888">+ New chat</text>
  <rect x="490" y="124" width="180" height="36" fill="#2A2A2A"/>
  <text x="510" y="146" font-size="10" fill="#CCCCCC">Fix API bug</text>
  <text x="510" y="178" font-size="10" fill="#555555">Auth refactor</text>
  <text x="510" y="202" font-size="10" fill="#555555">Code review</text>

  <!-- Chat messages -->
  <!-- User bubble -->
  <rect x="780" y="92" width="370" height="52" rx="10" fill="#EDEDE9"/>
  <text x="800" y="114" font-size="11" fill="#1A1A1A">Write a Python function to parse JSON</text>
  <text x="800" y="130" font-size="11" fill="#1A1A1A">from an API and handle errors.</text>

  <!-- AI response partial -->
  <text x="686" y="172" font-size="11" fill="#1A1A1A">Here's a robust implementation:</text>
  <rect x="686" y="184" width="420" height="130" rx="5" fill="#F1F1EE" stroke="#E4E4E0" stroke-width="1"/>
  <text x="700" y="203" font-size="10" fill="#888888" font-family="ui-monospace, Menlo, monospace">python</text>
  <line x1="686" y1="210" x2="1106" y2="210" stroke="#E4E4E0" stroke-width="1"/>
  <text x="700" y="228" font-size="10" fill="#1558D6" font-family="ui-monospace, Menlo, monospace">import</text>
  <text x="742" y="228" font-size="10" fill="#1A1A1A" font-family="ui-monospace, Menlo, monospace">requests, json</text>
  <text x="700" y="245" font-size="10" fill="#1558D6" font-family="ui-monospace, Menlo, monospace">def</text>
  <text x="722" y="245" font-size="10" fill="#6F42C1" font-family="ui-monospace, Menlo, monospace">fetch_json</text>
  <text x="779" y="245" font-size="10" fill="#1A1A1A" font-family="ui-monospace, Menlo, monospace">(url: str):</text>
  <text x="700" y="262" font-size="10" fill="#1A1A1A" font-family="ui-monospace, Menlo, monospace">    r = requests.get(url, timeout=10)</text>
  <text x="700" y="279" font-size="10" fill="#1A1A1A" font-family="ui-monospace, Menlo, monospace">    r.raise_for_status()</text>
  <text x="700" y="296" font-size="10" fill="#1558D6" font-family="ui-monospace, Menlo, monospace">    return</text>
  <text x="745" y="296" font-size="10" fill="#1A1A1A" font-family="ui-monospace, Menlo, monospace">r.json()</text>

  <!-- Streaming indicator -->
  <text x="686" y="334" font-size="11" fill="#1A1A1A">This handles both network timeouts and</text>
  <circle cx="828" cy="349" r="3" fill="#AAAAAA" opacity="0.9"/>
  <circle cx="840" cy="349" r="3" fill="#AAAAAA" opacity="0.6"/>
  <circle cx="852" cy="349" r="3" fill="#AAAAAA" opacity="0.3"/>

  <!-- ── Primary Idle Panel ── -->
  <!-- Panel: x=890, y=340, w=260, h=172 -->
  <rect x="893" y="344" width="260" height="172" rx="8"
        fill="#000" opacity="0.04"/>
  <rect x="892" y="342" width="260" height="172" rx="8"
        fill="#000" opacity="0.04"/>
  <rect x="890" y="338" width="260" height="172" rx="8"
        fill="#FAFAFA" stroke="#00000014" stroke-width="1"
        filter="url(#marquee-shadow)"/>

  <!-- Drag handle -->
  <circle cx="1008" cy="354" r="2" fill="#D0D0D0"/>
  <circle cx="1016" cy="354" r="2" fill="#D0D0D0"/>
  <circle cx="1024" cy="354" r="2" fill="#D0D0D0"/>

  <!-- Meta row -->
  <text x="906" y="378" font-size="9.5" fill="#888888" letter-spacing="0.4">PHYSICAL RESET</text>
  <text x="1134" y="378" font-size="9.5" fill="#888888" text-anchor="end">20 SEC</text>

  <!-- Title -->
  <text x="906" y="396" font-size="12" font-weight="500" fill="#3A3A3A">Look 20 feet away</text>

  <!-- Body -->
  <text x="906" y="416" font-size="12" fill="#1A1A1A">Pick the farthest object you can see</text>
  <text x="906" y="432" font-size="12" fill="#1A1A1A">and rest your eyes on it for 20 seconds.</text>

  <!-- Divider -->
  <line x1="890" y1="450" x2="1150" y2="450" stroke="#E8E8E8" stroke-width="1"/>

  <!-- Actions -->
  <text x="906" y="476" font-size="11" fill="#888888">Skip</text>
  <text x="1134" y="476" font-size="11" fill="#888888" text-anchor="end">Mute</text>

  <!-- Panel appear label (annotation) -->
  <text x="1175" y="430" font-size="11" fill="#3D8B7A" font-weight="500">Appears automatically.</text>
  <text x="1175" y="447" font-size="11" fill="#3D8B7A">Fades when AI responds.</text>

</svg>
