name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '**/tsconfig*.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '**/tsconfig*.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @idle/browser-extension exec playwright install chromium --with-deps

      - name: E2E tests (fixture playback — no live network)
        run: pnpm test:e2e
        # E2E_LIVE is intentionally unset — tests run against committed fixture HTML only
